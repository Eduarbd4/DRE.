function dreStatement(records,title='Demonstração do Resultado do Exercício'){const periods=[...new Set(records.map(x=>x.year+'-'+String(x.month).padStart(2,'0')))].sort(),rev=metric(records,'revenue');const body=DRE_LINES.map(([label,key,cls,sign])=>{const values=periods.map(p=>metric(records.filter(x=>x.year+'-'+String(x.month).padStart(2,'0')===p),key));const total=metric(records,key),ratio=rev?total/rev:0;return'<tr class="'+cls+'"><td>'+label+'</td>'+values.map(v=>'<td class="'+((sign<0?-Math.abs(v):v)<0?'neg':'')+'">'+accounting(v,sign<0)+'</td>').join('')+'<td class="dreTotal '+((sign<0?-Math.abs(total):total)<0?'neg':'')+'">'+accounting(total,sign<0)+'</td><td class="drePercent">'+pct(ratio)+'</td></tr>'}).join('');const periodHeads=periods.map(p=>'<th>'+MONTHS[+p.slice(5)-1].slice(0,3)+'/'+p.slice(2,4)+'</th>').join('');return'<section class="drePaper"><div class="dreHeading"><div><h2>'+esc(title)+'</h2><p>'+esc(filters.unit||'Todas as unidades')+' · regime de competência</p></div><div class="dreStamp"><b>DANE-SE FINANCEIRO</b><small>'+periods.length+' competência'+(periods.length===1?'':'s')+' analisada'+(periods.length===1?'':'s')+'</small></div></div><div class="dreScroll"><table class="dreTable"><thead><tr><th>Conta gerencial</th>'+periodHeads+'<th>Total</th><th>% Receita</th></tr></thead><tbody>'+body+'</tbody></table></div><div class="dreCaption">Valores entre parênteses representam custos e despesas. Percentuais calculados sobre a Receita Operacional do período.</div></section>'}
function dashboard(){const r=rows(),rev=metric(r,'revenue'),contribution=metric(r,'contribution'),ebitda=metric(r,'ebitda'),net=metric(r,'net'),margin=rev?ebitda/rev:0,netMargin=rev?net/rev:0,trend=monthly(r,'revenue'),expense=[['CMV',metric(r,'cmv')],['Despesas variáveis',metric(r,'variable')],['Despesas fixas',metric(r,'fixed')],['Despesas financeiras',metric(r,'financial')],['CAPEX',metric(r,'capex')]];setTimeout(()=>draw(trend,expense),0);const topExpense=[...expense].sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]))[0];return filterBar()+dreStatement(r)+'<div class="kpis">'+kpi('Receita operacional',money(rev),'Base de cálculo')+kpi('Margem de contribuição',money(contribution),rev?pct(contribution/rev)+' da receita':'Sem base','green')+kpi('EBITDA',money(ebitda),pct(margin)+' de margem',ebitda<0?'red':'green')+kpi('Resultado líquido',money(net),pct(netMargin)+' da receita',net<0?'red':'green')+kpi('Ponto de maior pressão',esc(topExpense?.[0]||'—'),money(topExpense?.[1]||0),'amber')+'</div><div class="dreExecutive">'+card('Leitura gerencial da DRE','<div class="dreSummary"><h3>Diagnóstico do resultado</h3><p>A receita operacional do recorte é <b>'+money(rev)+'</b>. Após custos e despesas operacionais, o EBITDA alcança <b>'+money(ebitda)+'</b>, com margem de <b>'+pct(margin)+'</b>. Depois do resultado financeiro e dos investimentos, o resultado líquido é <b>'+money(net)+'</b>, equivalente a <b>'+pct(netMargin)+'</b> da receita.</p><div class="dreSignals"><div class="dreSignal '+(margin<0?'risk':margin>=.1?'good':'')+'"><b>Operação:</b> '+(margin<0?'a atividade principal não gerou resultado operacional positivo.':margin<.1?'a geração operacional é positiva, porém com margem abaixo de 10%.':'a operação apresenta margem EBITDA superior a 10%.')+'</div><div class="dreSignal"><b>Estrutura:</b> '+esc(topExpense?.[0]||'Sem dados')+' é a maior pressão identificada, somando '+money(topExpense?.[1]||0)+'.</div><div class="dreSignal '+(net<0?'risk':'good')+'"><b>Resultado final:</b> '+(net<0?'há prejuízo líquido; revisar despesas financeiras, CAPEX e custos não recorrentes.':'o período encerra com lucro líquido positivo.')+'</div></div></div>','Análise automática')+card('Evolução mensal da receita','<div class="chart"><canvas id="trend"></canvas></div>','Gráfico de apoio')+'</div>'+card('Composição de custos e despesas','<div class="chart"><canvas id="expenses"></canvas></div>','Gráfico de apoio')}
function dashboardV2(){const r=rows(),rev=metric(r,'revenue'),contribution=metric(r,'contribution'),ebitda=metric(r,'ebitda'),net=metric(r,'net'),trend=monthly(r,'revenue'),expense=[['CMV',metric(r,'cmv')],['Despesas variáveis',metric(r,'variable')],['Despesas fixas',metric(r,'fixed')],['Despesas financeiras',metric(r,'financial')],['CAPEX',metric(r,'capex')]],periods=[...new Set(r.map(x=>x.year+'-'+String(x.month).padStart(2,'0')))].sort(),current=periods.at(-1),previous=periods.at(-2),currentNet=current?metric(r.filter(x=>x.year+'-'+String(x.month).padStart(2,'0')===current),'net'):net,previousNet=previous?metric(r.filter(x=>x.year+'-'+String(x.month).padStart(2,'0')===previous),'net'):0,change=previousNet?(currentNet-previousNet)/Math.abs(previousNet):0;setTimeout(()=>draw(trend,expense),0);const lines=DRE_LINES.map(([label,key,cls,sign])=>'<tr class="'+cls+'"><td>'+label+'</td><td class="'+((sign<0?-Math.abs(metric(r,key)):metric(r,key))<0?'neg':'')+'">'+accounting(metric(r,key),sign<0)+'</td></tr>').join(''),expenseTotal=expense.reduce((s,[,v])=>s+Math.abs(v),0),expenseRows=expense.map(([name,value])=>'<div><span>'+name+'</span><b>'+money(value)+'</b><span>'+pct(expenseTotal?Math.abs(value)/expenseTotal:0)+'</span></div>').join('');return filterBar()+'<div class="dashboardHeading"><b>Dashboard DRE · '+esc(filters.unit||'Todas as unidades')+'</b><span>Visão por competência · atualizado pelo Excel</span></div><div class="excelGrid"><section><div class="competenceBox"><span>Resultado da competência</span><strong>'+money(currentNet)+'</strong><span>Variação sobre anterior</span><span class="'+(change<0?'bad':'pos')+'">'+(previous?((change>0?'+':'')+pct(change)):'—')+'</span><span>Resultado anterior</span><span>'+money(previousNet)+'</span></div><div class="excelPanel"><div class="excelTitle">Demonstração do resultado</div><table class="miniDre"><tbody>'+lines+'</tbody></table></div></section><section><div class="excelPanel"><div class="excelTitle">Composição de custos e despesas</div><div class="expenseList">'+expenseRows+'<div class="total"><span>Total de custos e despesas</span><b>'+money(expenseTotal)+'</b><span>100%</span></div></div></div><div class="excelPanel" style="margin-top:10px"><div class="excelTitle">Participação das despesas</div><div class="dashChart"><canvas id="expenses"></canvas></div></div></section><section><div class="excelPanel"><div class="excelTitle">Evolução da receita por competência</div><div class="dashChart tall"><canvas id="trend"></canvas></div></div><div class="excelPanel" style="margin-top:10px"><div class="excelTitle">Indicadores de resultado</div><div class="expenseList"><div><span>Receita operacional</span><b>'+money(rev)+'</b><span>100%</span></div><div><span>Margem de contribuição</span><b>'+money(contribution)+'</b><span>'+pct(rev?contribution/rev:0)+'</span></div><div><span>EBITDA</span><b>'+money(ebitda)+'</b><span>'+pct(rev?ebitda/rev:0)+'</span></div><div class="total"><span>Resultado líquido</span><b>'+money(net)+'</b><span>'+pct(rev?net/rev:0)+'</span></div></div></div></section></div>'}
function dashboardV3(){const r=rows(),rev=metric(r,'revenue'),cmv=metric(r,'cmv'),variable=metric(r,'variable'),fixed=metric(r,'fixed'),contribution=metric(r,'contribution'),ebitda=metric(r,'ebitda'),financial=metric(r,'financial'),net=metric(r,'net'),trend=monthly(r,'revenue'),expense=[['CMV',cmv],['Despesas variáveis',variable],['Despesas fixas',fixed],['Despesas financeiras',financial],['CAPEX',metric(r,'capex')]];setTimeout(()=>draw(trend,expense),0);const units=[...new Set(model.map(x=>x.unit))].filter(x=>x!=='Consolidado'),storeData=units.map(unit=>{const u=model.filter(x=>x.unit===unit&&(!filters.year||x.year==filters.year)&&(!filters.month||x.month==filters.month));return[unit,metric(u,'revenue'),metric(u,'ebitda')] }).sort((a,b)=>b[1]-a[1]),max=Math.max(1,...storeData.map(x=>x[1])),bars=storeData.map(([name,revenue,storeEbitda])=>'<div class="storeBar"><span>'+esc(name)+'</span><div class="storeTrack"><div class="storeFill" style="width:'+(revenue/max*100)+'%"></div></div><b>'+money(revenue)+'</b></div>').join('');return filterBar()+'<div class="analyticsKpis"><div class="analyticsKpi"><span>Receita operacional</span><b>'+money(rev)+'</b><small>'+esc(filters.year||'Todos os anos')+'</small></div><div class="analyticsKpi purple"><span>Margem de contribuição</span><b>'+money(contribution)+'</b><small>'+pct(rev?contribution/rev:0)+' da receita</small></div><div class="analyticsKpi '+(ebitda<0?'risk':'good')+'"><span>EBITDA</span><b>'+money(ebitda)+'</b><small>'+pct(rev?ebitda/rev:0)+' de margem</small></div><div class="analyticsKpi '+(net<0?'risk':'good')+'"><span>Resultado líquido</span><b>'+money(net)+'</b><small>'+pct(rev?net/rev:0)+' da receita</small></div><div class="analyticsKpi"><span>Despesas financeiras</span><b>'+money(financial)+'</b><small>'+pct(rev?financial/rev:0)+' da receita</small></div></div><div class="dashboardGrid"><div class="excelPanel"><div class="excelTitle">Evolução mensal da receita</div><div class="dashChart tall"><canvas id="trend"></canvas></div></div><div class="excelPanel"><div class="excelTitle">Composição dos custos e despesas</div><div class="dashChart tall"><canvas id="expenses"></canvas></div></div></div><div class="marginStrip"><div><span>Margem de contribuição</span><b>'+pct(rev?contribution/rev:0)+'</b></div><div><span>Margem EBITDA</span><b>'+pct(rev?ebitda/rev:0)+'</b></div><div><span>Margem líquida</span><b>'+pct(rev?net/rev:0)+'</b></div></div><div class="excelPanel" style="margin-top:9px"><div class="excelTitle">Receita por loja</div><div class="storeBars">'+(bars||'<p>Não há abas individuais de lojas para este filtro.</p>')+'</div></div>'}
function comparison(){const base=rows().filter(x=>x.year===2025||x.year===2026),rev26=metric(base.filter(x=>x.year===2026),'revenue');const body=DRE_LINES.map(([label,key,cls,sign])=>{const a=metric(base.filter(x=>x.year===2025),key),b=metric(base.filter(x=>x.year===2026),key),d=b-a,p=a?d/Math.abs(a):null;return'<tr class="'+cls+'"><td>'+label+'</td><td>'+accounting(a,sign<0)+'</td><td>'+accounting(b,sign<0)+'</td><td class="'+(d>=0?'pos':'neg')+'">'+accounting(d)+'</td><td>'+(p===null?'—':pct(p))+'</td><td class="drePercent">'+(rev26?pct(b/rev26):'—')+'</td></tr>'}).join('');return filterBar()+'<section class="drePaper"><div class="dreHeading"><div><h2>DRE comparativa 2025 × 2026</h2><p>'+esc(filters.unit||'Todas as unidades')+' · análise horizontal e vertical</p></div><div class="dreStamp"><b>DANE-SE FINANCEIRO</b><small>Valores acumulados</small></div></div><div class="dreScroll"><table class="dreTable"><thead><tr><th>Conta gerencial</th><th>2025</th><th>2026</th><th>Variação R$</th><th>Variação %</th><th>% Receita 2026</th></tr></thead><tbody>'+body+'</tbody></table></div><div class="dreCaption">Análise horizontal: variação entre exercícios. Análise vertical: participação sobre a receita de 2026.</div></section>'}
function stores(){const units=[...new Set(model.map(x=>x.unit))].filter(x=>x!=='Consolidado'),body=units.map(unit=>{const r=model.filter(x=>x.unit===unit&&(!filters.year||x.year==filters.year)&&(!filters.month||x.month==filters.month)),rev=metric(r,'revenue'),eb=metric(r,'ebitda'),net=metric(r,'net');return'<tr><td>'+esc(unit)+'</td><td>'+money(rev)+'</td><td>'+money(eb)+'</td><td>'+(rev?pct(eb/rev):'—')+'</td><td class="'+(net>=0?'pos':'neg')+'">'+money(net)+'</td></tr>'}).join('');return filterBar()+'<section class="hero"><small>DESEMPENHO POR UNIDADE</small><h2>Comparação entre lojas</h2><p>Ranking de receita e rentabilidade com base nas abas individuais disponíveis.</p></section>'+card('Resultados por loja','<div class="tableWrap"><table><thead><tr><th>Loja</th><th>Receita</th><th>EBITDA</th><th>Margem EBITDA</th><th>Resultado líquido</th></tr></thead><tbody>'+body+'</tbody></table></div>','Somente abas por unidade')}
function statement(){const r=rows(),groups=new Map;r.forEach(x=>{const k=x.label;if(!groups.has(k))groups.set(k,new Map);groups.get(k).set(x.year+'-'+String(x.month).padStart(2,'0'),(groups.get(k).get(x.year+'-'+String(x.month).padStart(2,'0'))||0)+x.value)});const periods=[...new Set(r.map(x=>x.year+'-'+String(x.month).padStart(2,'0')))].sort(),body=[...groups].map(([label,vals])=>'<tr><td>'+esc(label)+'</td>'+periods.map(p=>'<td>'+money(vals.get(p)||0)+'</td>').join('')+'</tr>').join('');return filterBar()+card('Demonstrativo completo','<div class="tableWrap"><table><thead><tr><th>Conta</th>'+periods.map(p=>'<th>'+p+'</th>').join('')+'</tr></thead><tbody>'+body+'</tbody></table></div>','Linhas da planilha importada')}
function statementV2(){const units=[...new Set(model.map(x=>x.unit))].sort((a,b)=>(a==='Consolidado'?-1:b==='Consolidado'?1:a.localeCompare(b,'pt-BR'))),availableYears=[...new Set(model.filter(x=>x.unit===filters.unit).map(x=>x.year).filter(Boolean))].sort();if(!units.includes(filters.unit))filters.unit=units[0];if(!availableYears.map(String).includes(String(filters.year)))filters.year=String(availableYears.at(-1)||'');filters.month='';const unitTabs=units.map(unit=>'<button class="'+(unit===filters.unit?'active':'')+'" data-dre-unit="'+esc(unit)+'">'+esc(unit)+'</button>').join(''),yearTabs=availableYears.map(year=>'<button class="'+(String(year)===String(filters.year)?'active':'')+'" data-dre-year="'+year+'">'+year+'</button>').join(''),records=model.filter(x=>x.unit===filters.unit&&(!filters.year||x.year==filters.year));return'<section class="sheetNav"><div class="sheetNavTitle">Escolha a loja para abrir a DRE</div><div class="storeTabs">'+unitTabs+'</div><div class="yearTabs">'+yearTabs+'</div><div class="sheetHint">A loja selecionada abre como uma aba da planilha. O ano exibe as competências de janeiro a dezembro.</div></section>'+dreStatement(records,'DRE · '+filters.unit+' · '+filters.year)}
function sources(){const principles=trace.principles.map(x=>'<div class="insight"><b>'+esc(x.item)+'</b><span>'+esc(typeof x.value==='number'?(x.value<1?pct(x.value):String(x.value)):x.value)+'</span></div>').join(''),mapping=trace.mappings.map(x=>'<tr><td>'+esc(x.group)+'</td><td>'+esc(x.line)+'</td><td>'+esc(x.source)+'</td><td>'+esc(x.report)+'</td><td>'+esc(x.period)+'</td><td>'+esc(x.criterion)+'</td><td>'+esc(x.validation)+'</td></tr>').join(''),details=trace.details.map(x=>'<tr><td>'+esc(x.code)+'</td><td>'+esc(x.category)+'</td><td>'+esc(x.unit)+'</td><td>'+esc(x.source)+'</td><td>'+esc(x.criterion)+'</td></tr>').join(''),checks=trace.checks.map(x=>'<tr><td>'+esc(x.check)+'</td><td>'+esc(x.description)+'</td><td>'+esc(x.unit)+'</td><td>'+esc(x.tolerance)+'</td><td class="'+(String(x.status).toUpperCase()==='OK'?'pos':'')+'">'+esc(x.status||'Conferir no Excel')+'</td></tr>').join('');return'<section class="hero"><small>RASTREABILIDADE DO MODELO</small><h2>Fontes, critérios e conciliações</h2><p>Cada informação pode ser ligada ao relatório de origem, à competência e ao critério de rateio ou apropriação.</p></section><div class="analysisGrid">'+principles+'</div>'+card('Mapa das informações','<div class="tableWrap"><table><thead><tr><th>Grupo</th><th>Linha na DRE</th><th>Fonte principal</th><th>Aba/relatório</th><th>Período</th><th>Critério</th><th>Validação</th></tr></thead><tbody>'+mapping+'</tbody></table></div>','Resumo da aba Fontes e Critérios')+card('Base detalhada de critérios','<div class="tableWrap"><table><thead><tr><th>Código</th><th>Categoria DRE</th><th>Unidade</th><th>Fonte</th><th>Critério aplicado</th></tr></thead><tbody>'+details+'</tbody></table></div>',trace.details.length+' regras rastreadas')+card('Conciliações automáticas','<div class="tableWrap"><table><thead><tr><th>Verificação</th><th>Descrição</th><th>Unidade</th><th>Tolerância</th><th>Status</th></tr></thead><tbody>'+checks+'</tbody></table></div>','Controles presentes na planilha')}
function instructions(){return'<section class="hero"><small>AUTOMAÇÃO CONTA AZUL</small><h2>Atualização simples e segura</h2><p>O painel lê arquivos Excel no navegador; os dados não precisam ser enviados para outro servidor.</p></section><div class="analysisGrid"><div class="card analysis"><h3>1 · Exportar</h3><p class="analysisLead">No Conta Azul, exporte o relatório DRE ou o demonstrativo gerencial em Excel, mantendo as descrições das contas e as competências.</p></div><div class="card analysis"><h3>2 · Atualizar</h3><p class="analysisLead">Clique em <b>Atualizar pelo Excel</b> e selecione o arquivo. O sistema reconhece as abas, anos, meses e principais linhas automaticamente.</p></div><div class="card analysis"><h3>3 · Conferir</h3><p class="analysisLead">Valide Receita, EBITDA e Resultado Líquido com os totais do Conta Azul. Formatos muito diferentes podem exigir um ajuste no mapeamento.</p></div></div>'+card('Compatibilidade','<div class="analysis"><div class="analysisLead">O importador reconhece o formato atual da DANE-SE e nomes comuns do Conta Azul, como Receita Líquida, CMV, Despesas, EBITDA e Resultado Líquido. Uma integração direta via API pode ser adicionada depois, dependendo das credenciais e permissões disponíveis no Conta Azul.</div></div>','Orientação de implantação')}
function draw(trend,expense){charts.forEach(c=>c.destroy());charts=[];const common={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{boxWidth:10,font:{size:9}}},tooltip:{callbacks:{label:c=>c.dataset.label+': '+money(c.raw)}}},scales:{x:{grid:{display:false}},y:{beginAtZero:true,grid:{color:'#e8edf4'},ticks:{callback:v=>new Intl.NumberFormat('pt-BR',{notation:'compact',style:'currency',currency:'BRL'}).format(v)}}}};if($('#trend'))charts.push(new Chart($('#trend'),{data:{labels:trend.map(x=>x.label),datasets:[{type:'bar',label:'Receita',data:trend.map(x=>x.value),backgroundColor:'#3267d6aa',borderRadius:6},{type:'line',label:'Tendência',data:trend.map(x=>x.value),borderColor:'#118663',tension:.3,pointRadius:3}]},options:common}));if($('#expenses'))charts.push(new Chart($('#expenses'),{type:'doughnut',data:{labels:expense.map(x=>x[0]),datasets:[{data:expense.map(x=>Math.abs(x[1])),backgroundColor:['#3267d6','#21a5cf','#ca9130','#c84c55','#7761d7'],borderWidth:3,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'right',labels:{boxWidth:10,font:{size:9}}},tooltip:{callbacks:{label:c=>c.label+': '+money(c.raw)}}}}}))}
function bind(){['unit','year','month'].forEach(id=>{const field=$('#'+id);if(field)field.onchange=e=>{filters[id]=e.target.value;if(id==='year')filters.month='';render()}});const clear=$('#clear');if(clear)clear.onclick=()=>{const years=[...new Set(model.map(x=>x.year).filter(Boolean))].sort();filters={unit:'Consolidado',year:String(years.at(-1)||''),month:''};render()};document.querySelectorAll('[data-dre-unit]').forEach(button=>button.onclick=()=>{filters.unit=button.dataset.dreUnit;const years=[...new Set(model.filter(x=>x.unit===filters.unit).map(x=>x.year).filter(Boolean))].sort();filters.year=String(years.at(-1)||'');filters.month='';render()});document.querySelectorAll('[data-dre-year]').forEach(button=>button.onclick=()=>{filters.year=button.dataset.dreYear;filters.month='';render()})}
function render(){charts.forEach(c=>c.destroy());charts=[];const fn={dashboard:dashboardV3,comparison,stores,statement:statementV2,sources,instructions}[view];$('#app').innerHTML=fn();if(!['instructions','sources'].includes(view))bind()}

try{const bytes=Uint8Array.from(atob(EMBEDDED_XLSX),c=>c.charCodeAt(0));load(bytes.buffer,'DRE DANE-SE incorporada')}catch(err){$('#app').innerHTML='<div class="empty">'+esc(err.message)+'</div>'}
